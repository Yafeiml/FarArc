name: Fetch official 1Remote 1.2.1

on:
  push:
    branches:
      - "fix/win11-25h2-taskbar-registration"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetch-official-1remote-121-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch-and-verify:
    runs-on: windows-latest
    steps:
      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download official 1Remote 1.2.1 release asset
        shell: pwsh
        run: |
          $url = "https://github.com/1Remote/1Remote/releases/download/1.2.1/1Remote-1.2.1-net9-x64.zip"
          $zip = Join-Path $env:RUNNER_TEMP "1Remote-1.2.1-net9-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          if (-not (Test-Path $zip)) { throw "Official release download failed." }
          $size = (Get-Item $zip).Length
          if ($size -lt 1MB) { throw "Downloaded file is unexpectedly small: $size bytes" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "OFFICIAL_ZIP=$zip" >> $env:GITHUB_ENV
          "OFFICIAL_SHA256=$hash" >> $env:GITHUB_ENV
          Write-Host "Official asset size: $size bytes"
          Write-Host "Official asset SHA256: $hash"

      - name: Verify ZIP and inspect top-level contents
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP "official-1Remote-1.2.1"
          Expand-Archive -Path $env:OFFICIAL_ZIP -DestinationPath $extract -Force
          $files = Get-ChildItem -Path $extract -Recurse -File
          if ($files.Count -eq 0) { throw "Official release ZIP contains no files." }
          $exe = $files | Where-Object { $_.Name -ieq "1Remote.exe" } | Select-Object -First 1
          if ($null -eq $exe) { throw "1Remote.exe was not found in the official release ZIP." }
          "OFFICIAL_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          Write-Host "Official executable: $($exe.FullName)"
          Write-Host "Official executable size: $($exe.Length) bytes"
          Get-ChildItem -Path $extract | Select-Object Name, Length, Mode | Format-Table -AutoSize

      - name: Verify database-compatibility value can be recovered without disclosure
        shell: pwsh
        run: |
          dotnet tool install --global sfextract
          dotnet tool install --global ilspycmd
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"

          $bundleDir = Join-Path $env:RUNNER_TEMP "official-bundle"
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          & sfextract $env:OFFICIAL_EXE -o $bundleDir
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract the official .NET single-file bundle." }

          $assembly = Get-ChildItem -Path $bundleDir -Recurse -File -Filter "1Remote.dll" | Select-Object -First 1
          if ($null -eq $assembly) { throw "The managed 1Remote.dll entry was not found in the official bundle." }

          $decompiled = Join-Path $env:RUNNER_TEMP "Assert.decompiled.cs"
          & ilspycmd -t "_1RM.Assert" $assembly.FullName | Set-Content -Path $decompiled -Encoding UTF8
          if ($LASTEXITCODE -ne 0) { throw "ILSpy failed to inspect the managed assembly from the official bundle." }

          $text = Get-Content $decompiled -Raw
          $match = [regex]::Match($text, 'STRING_SALT\s*=\s*"((?:\\.|[^"\\])*)"\s*;')
          if (-not $match.Success) { throw "STRING_SALT was not found in the official managed assembly." }
          $saltLiteral = $match.Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($saltLiteral) -or $saltLiteral.Contains("REPLACE_ME_WITH_SALT")) {
            throw "The recovered database-compatibility value is invalid."
          }

          Write-Output "::add-mask::$saltLiteral"
          Write-Host "Database-compatible build value was recovered successfully without printing or uploading it."
          Remove-Item $decompiled -Force
          Remove-Item $bundleDir -Recurse -Force

      - name: Upload verified official asset
        uses: actions/upload-artifact@v4
        with:
          name: official-1Remote-1.2.1-net9-x64
          path: ${{ env.OFFICIAL_ZIP }}
          if-no-files-found: error
          retention-days: 7

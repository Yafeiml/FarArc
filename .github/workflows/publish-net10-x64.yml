name: .NET 10 x64 自动构建与发布

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: net10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  verify:
    name: 验证 .NET 10
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: 还原依赖
        shell: pwsh
        run: |
          dotnet restore .\Tests\Tests.csproj
          dotnet restore .\Dragablz\Dragablz.Test\Dragablz.Test.csproj
          dotnet restore .\Dragablz\DragablzDemo\DragablzDemo.csproj

      - name: 构建应用
        run: dotnet build .\Ui\Ui.csproj -c Debug --no-restore --no-incremental

      - name: 运行应用测试
        run: dotnet test .\Tests\Tests.csproj -c Debug --no-restore

      - name: 运行 Dragablz 测试
        run: dotnet test .\Dragablz\Dragablz.Test\Dragablz.Test.csproj -c Debug --no-restore

      - name: 构建 Dragablz 示例
        run: dotnet build .\Dragablz\DragablzDemo\DragablzDemo.csproj -c Debug --no-restore --no-incremental

      - name: 审计 NuGet 漏洞
        run: dotnet list .\Ui\Ui.csproj package --vulnerable --include-transitive

  release:
    name: 发布 Windows x64 预览版
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出源码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: 还原依赖
        run: dotnet restore .\Ui\Ui.csproj -p:Configuration=Release

      - name: 生成版本与发布标签
        shell: pwsh
        run: |
          $buildVersion = .\scripts\Get-Version.ps1
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $releaseTag = "v$buildVersion-build.$env:GITHUB_RUN_NUMBER.$shortSha"
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          "PACKAGE_SUFFIX=$buildVersion-build.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_ENV

      - name: 打包对应源码
        shell: pwsh
        run: |
          $repositoryRoot = (Resolve-Path ".").Path
          $sourceStage = Join-Path $env:RUNNER_TEMP "1RemoteNET10-source-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sourceFolderName = "1Remote.NET10-$env:PACKAGE_SUFFIX-source"
          $sourceRoot = Join-Path $sourceStage $sourceFolderName
          $sourceZip = Join-Path $repositoryRoot "$sourceFolderName.zip"
          $excludedDirectories = @(".git", "bin", "obj")

          function Copy-SourceTree([string] $from, [string] $to) {
            New-Item -ItemType Directory -Path $to -Force | Out-Null
            Get-ChildItem -LiteralPath $from -Force | ForEach-Object {
              $destination = Join-Path $to $_.Name
              if ($_.PSIsContainer) {
                if ($excludedDirectories -notcontains $_.Name) {
                  Copy-SourceTree $_.FullName $destination
                }
              } elseif ($_.Name -ne ".git") {
                Copy-Item -LiteralPath $_.FullName -Destination $destination
              }
            }
          }

          Copy-SourceTree $repositoryRoot $sourceRoot

          $vncLicense = Join-Path $repositoryRoot "ThirdParty\VncSharpCore\COPYING.txt"
          if (!(Test-Path -LiteralPath $vncLicense -PathType Leaf)) {
            throw "仓库内缺少 VncSharpCore 的 COPYING.txt。"
          }

          Compress-Archive -LiteralPath $sourceRoot -DestinationPath $sourceZip
          "SOURCE_ZIP=$sourceZip" >> $env:GITHUB_ENV

      - name: 注入发布加密密钥
        shell: pwsh
        env:
          ENCRYPTION_KEY: ${{ secrets.GLOBAL_STRING_ENCRYPTION_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ENCRYPTION_KEY)) {
            throw "必须配置仓库 Secret：GLOBAL_STRING_ENCRYPTION_KEY。"
          }
          try {
            $keyBytes = [Convert]::FromBase64String($env:ENCRYPTION_KEY)
          }
          catch {
            throw "GLOBAL_STRING_ENCRYPTION_KEY 必须是 Base64 编码的随机密钥。"
          }
          if ($keyBytes.Length -lt 32) {
            throw "GLOBAL_STRING_ENCRYPTION_KEY 解码后至少需要 32 个随机字节。"
          }
          .\scripts\Set-Secret.ps1 -filePath .\Ui\Assert.cs -Pattern "===REPLACE_ME_WITH_ENCRYPTION_KEY===" -Secret $env:ENCRYPTION_KEY

      - name: 发布依赖 .NET 10 的 x64 包
        run: dotnet publish .\Ui\Ui.csproj -p:PublishProfile=x64-net100

      - name: 发布自包含 x64 包
        run: dotnet publish .\Ui\Ui.csproj -p:PublishProfile=x64-net100-self-contained

      - name: 打包发布文件
        shell: pwsh
        run: |
          $frameworkZip = "1Remote.NET10-$env:PACKAGE_SUFFIX-net10-x64.zip"
          $selfContainedZip = "1Remote.NET10-$env:PACKAGE_SUFFIX-net10-x64-self-contained.zip"
          Compress-Archive -Path ".\Ui\bin\Release\net10.0-windows\publish\win-x64\*" -DestinationPath $frameworkZip
          Compress-Archive -Path ".\Ui\bin\Release\net10.0-windows-self-contained\publish\win-x64\*" -DestinationPath $selfContainedZip
          "FRAMEWORK_ZIP=$frameworkZip" >> $env:GITHUB_ENV
          "SELF_CONTAINED_ZIP=$selfContainedZip" >> $env:GITHUB_ENV

      - name: 创建 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @(
            "这是由 main 分支提交自动生成的 Windows x64 预览版。",
            "",
            "- 仅支持 .NET 10 / Windows x64。",
            "- 推荐下载 self-contained 包，无需预装 .NET Desktop Runtime。",
            "- 数据库与原 1Remote 不兼容，不能覆盖安装或无损升级，请使用全新数据库。",
            "- 本次二进制对应的完整源码已作为 source 压缩包附加。",
            "",
            "Commit: $env:GITHUB_SHA"
          ) -join "`n"
          gh release create $env:RELEASE_TAG `
            $env:FRAMEWORK_ZIP `
            $env:SELF_CONTAINED_ZIP `
            $env:SOURCE_ZIP `
            --target $env:GITHUB_SHA `
            --title "1Remote.NET10 $env:PACKAGE_SUFFIX" `
            --notes $notes `
            --prerelease
